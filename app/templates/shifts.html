<div class="double-book"><section class="panel"><h3>已归档交班账</h3>{% for run in runs %}<p><a href="{{ url_for('ramp.view',tab='sign',sample=sample,batch=run.batch) }}">{{ run.batch[:15] }}</a> · 车辆库存差 {{ run.totals.difference_g|kg }} kg</p>{% else %}<p>交班账尚未归档。</p>{% endfor %}</section>
<section class="panel"><h3>三联单重跑</h3><form id="archive" data-sample="{{ sample }}"><details><summary>填写自有三联单</summary><label for="tickets">计量票 CSV</label><textarea id="tickets" rows="2"></textarea><label for="receipts">签收单 CSV</label><textarea id="receipts" rows="2"></textarea><label for="stock">库存表 CSV</label><textarea id="stock" rows="2"></textarea></details><button>复算并归档</button></form></section></div>
